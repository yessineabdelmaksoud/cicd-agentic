apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: agent
  name: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: agent
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/infra-cicd-net: "true"
        io.kompose.service: agent
    spec:
      containers:
        - env:
            - name: AGENT_EXTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  key: AGENT_EXTERNAL_URL
                  name: env
            - name: AGENT_PORT
              valueFrom:
                configMapKeyRef:
                  key: AGENT_PORT
                  name: env
            - name: GITLAB_EXTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  key: GITLAB_EXTERNAL_URL
                  name: env
            - name: GITLAB_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  key: GITLAB_PROJECT_ID
                  name: env
            - name: MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  key: MAX_ATTEMPTS
                  name: env
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: MINIO_ENDPOINT
                  name: env
            - name: MINIO_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  key: MINIO_ROOT_USER
                  name: env
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  key: REDIS_URL
                  name: env
            # --- Secrets (fix.md security §14 — K8s Secret, not ConfigMap) ---
            - name: GITLAB_PROJECT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GITLAB_PROJECT_TOKEN
                  name: env-secret
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GITLAB_ROOT_PASSWORD
                  name: env-secret
            - name: GITLAB_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GITLAB_RUNNER_TOKEN
                  name: env-secret
                  optional: true
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GRAFANA_ADMIN_PASSWORD
                  name: env-secret
                  optional: true
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MINIO_ROOT_PASSWORD
                  name: env-secret
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  key: OPENROUTER_API_KEY
                  name: env-secret
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: WEBHOOK_SECRET
                  name: env-secret
          image: infra-agent:latest
          imagePullPolicy: Never
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:8000/health
            failureThreshold: 3
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          name: agent
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            # requests, not just limits (fix.md FIX-16) — without a request a
            # fat Yocto build pod can starve the agent of CPU/memory instead
            # of the scheduler protecting it. Matches worker's headroom bump
            # (see worker-deployment.yaml) for the same reason.
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      restartPolicy: Always
