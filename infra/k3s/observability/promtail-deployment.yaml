apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: promtail
  name: promtail
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: promtail
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/infra-cicd-net: 'true'
        io.kompose.service: promtail
    spec:
      containers:
      - args:
        - -config.file=/etc/promtail/config.yml
        image: grafana/promtail:3.1.0
        name: promtail
        resources:
          limits:
            memory: '134217728'
        volumeMounts:
        - mountPath: /var/log
          name: promtail-claim0
          readOnly: true
        - mountPath: /var/lib/docker/containers
          name: promtail-claim1
          readOnly: true
        - mountPath: /var/run/docker.sock
          name: promtail-claim2
        - mountPath: /etc/promtail/config.yml
          name: promtail-claim3
          readOnly: true
      restartPolicy: Always
      volumes:
      - hostPath:
          path: /var/log
          type: DirectoryOrCreate
        name: promtail-claim0
      - hostPath:
          path: /var/lib/docker/containers
          type: DirectoryOrCreate
        name: promtail-claim1
      - name: promtail-claim2
        persistentVolumeClaim:
          claimName: promtail-claim2
      - hostPath:
          path: /home/yessine/Documents/kpit stage/ai-cicd-embedded/observability/promtail/promtail-config.yaml
          type: File
        name: promtail-claim3
