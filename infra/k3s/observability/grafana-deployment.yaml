apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/infra-cicd-net: 'true'
        io.kompose.service: grafana
    spec:
      containers:
      - env:
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        image: grafana/grafana:11.1.0
        name: grafana
        ports:
        - containerPort: 3000
          protocol: TCP
        resources:
          limits:
            memory: '268435456'
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-data
        - mountPath: /etc/grafana/provisioning
          name: grafana-claim1
          readOnly: true
        - mountPath: /var/lib/grafana/dashboards
          name: grafana-claim2
          readOnly: true
      restartPolicy: Always
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data
      - hostPath:
          path: /home/yessine/Documents/kpit stage/ai-cicd-embedded/observability/grafana/provisioning
          type: DirectoryOrCreate
        name: grafana-claim1
      - hostPath:
          path: /home/yessine/Documents/kpit stage/ai-cicd-embedded/observability/grafana/dashboards
          type: DirectoryOrCreate
        name: grafana-claim2
