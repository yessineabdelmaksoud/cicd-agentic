apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: prometheus
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/infra-cicd-net: 'true'
        io.kompose.service: prometheus
    spec:
      containers:
      - args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=15d
        - --web.console.libraries=/etc/prometheus/console_libraries
        - --web.console.templates=/etc/prometheus/consoles
        image: prom/prometheus:v2.53.0
        name: prometheus
        ports:
        - containerPort: 9090
          protocol: TCP
        resources:
          limits:
            memory: '268435456'
        volumeMounts:
        - mountPath: /etc/prometheus/prometheus.yml
          name: prometheus-claim0
          readOnly: true
        - mountPath: /etc/prometheus/rules
          name: prometheus-claim1
          readOnly: true
        - mountPath: /prometheus
          name: prometheus-data
      restartPolicy: Always
      volumes:
      - hostPath:
          path: /home/yessine/Documents/kpit stage/ai-cicd-embedded/observability/prometheus/prometheus.yml
          type: File
        name: prometheus-claim0
      - hostPath:
          path: /home/yessine/Documents/kpit stage/ai-cicd-embedded/observability/prometheus/rules
          type: DirectoryOrCreate
        name: prometheus-claim1
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-data
