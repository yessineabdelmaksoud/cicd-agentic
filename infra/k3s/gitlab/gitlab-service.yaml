apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: gitlab
  name: gitlab
spec:
  ports:
    - name: "80"
      port: 80
      targetPort: 80
    - name: "443"
      port: 443
      targetPort: 443
    - name: "2222"
      port: 2222
      targetPort: 22
  selector:
    io.kompose.service: gitlab
