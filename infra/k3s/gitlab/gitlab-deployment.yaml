apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: gitlab
  name: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gitlab
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/infra-cicd-net: "true"
        io.kompose.service: gitlab
    spec:
      containers:
        - env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://localhost'
                gitlab_rails['gitlab_shell_ssh_port'] = 2222
                # Réduire la RAM utilisée par GitLab
                puma['worker_processes'] = 2
                sidekiq['concurrency'] = 5
                prometheus_monitoring['enable'] = false
                gitlab_rails['monitoring_whitelist'] = ['127.0.0.1']
                # Désactiver les fonctionnalités non nécessaires
                gitlab_pages['enable'] = false
                registry['enable'] = false
                alertmanager['enable'] = false
                gitlab_exporter['enable'] = false
                node_exporter['enable'] = false
                redis_exporter['enable'] = false
                postgres_exporter['enable'] = false
                pgbouncer_exporter['enable'] = false
          image: gitlab/gitlab-ce:17.1.0-ce.0
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost/users/sign_in
            failureThreshold: 5
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          name: gitlab
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
            - containerPort: 22
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/gitlab
              name: gitlab-config
            - mountPath: /var/log/gitlab
              name: gitlab-logs
            - mountPath: /var/opt/gitlab
              name: gitlab-data
      hostname: localhost
      restartPolicy: Always
      volumes:
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: gitlab-logs
          persistentVolumeClaim:
            claimName: gitlab-logs
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data
