apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: /tmp/kompose convert -f docker-compose.yml -o k3s/
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.network/infra-cicd-net: "true"
    io.kompose.service: minio-init
  name: minio-init
spec:
  containers:
    - command:
        - /bin/sh
        - -c
        - |2
            mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD;
            mc mb --ignore-existing local/build-logs;
            mc mb --ignore-existing local/build-artifacts;
            mc mb --ignore-existing local/agent-results;
            mc anonymous set download local/build-logs;
            echo '✅ MinIO buckets created: build-logs, build-artifacts, agent-results';
      env:
        - name: MINIO_ROOT_PASSWORD
          value: password123
        - name: MINIO_ROOT_USER
          value: admin
      image: minio/mc:latest
      name: minio-init
  restartPolicy: Never
